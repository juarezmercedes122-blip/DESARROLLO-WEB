

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API de Pokémon</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Personajes de Pokémon</h1>

    <h2>Buscador de Pokémon</h2>

    <div class="search-container">

        <input
            type="text"
            id="search-input"
            placeholder="Ingresa el ID o nombre"
        >

        <button onclick="searchCharacter()">
            Buscar
        </button>

        <button onclick="getCharacters()">
            Mostrar todos
        </button>

    </div>

    <h3 id="total-personajes"></h3>

    <div id="characters-container" class="container"></div>

    <script src="app.js"></script>

</body>
</html>
